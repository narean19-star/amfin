name: Deploy to GitHub Pages

on:
  # Runs on pushes to the main branch
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Create secrets file 🤫
        run: |
          echo "const SUPABASE_URL = '${{ secrets.SUPABASE_URL }}';" > local-secrets.js
          echo "const SUPABASE_KEY = '${{ secrets.SUPABASE_KEY }}';" >> local-secrets.js
          echo "const GROQ_API_KEY = '${{ secrets.GROQ_API_KEY }}';" >> local-secrets.js

      - name: Prepare deployment artifact 📦
        run: |
          mkdir -p deployment
          cp index.html app.js style.css sw.js manifest.json local-secrets.js supabase-client.js groq-client.js deployment/
          cp -r icons deployment/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './deployment'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4