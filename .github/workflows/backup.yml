name: Backup data.json

on:
  schedule:
    # Runs daily at midnight UTC. You can adjust the schedule.
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual triggering from the Actions tab.

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      # Required to push commits back to the repository.
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create timestamped backup
        id: backup
        run: |
          if [ ! -f data.json ]; then
            echo "data.json not found, skipping backup."
            exit 0
          fi
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H-%M-%SZ")
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT
          mkdir -p backups
          cp data.json backups/data-${TIMESTAMP}.json
          git add backups/data-${TIMESTAMP}.json

      - name: Commit and push changes
        run: |
          if git diff --staged --quiet; then
            echo "No changes to backup."
            exit 0
          fi
          git commit -m "chore: Add data.json backup for ${{ steps.backup.outputs.timestamp }}"
          git push